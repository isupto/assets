name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every hook in prek.toml.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  build:
    name: Generate files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Icons and banners are build output (see .gitignore). Each script's lockfile pins its dependencies.
      - name: Generate icons
        run: uv run --locked icon/script.py

      - name: Generate banners
        run: uv run --locked banner/script.py

      # Publish only the public files, not the repo's config (.github, prek.toml, wrangler.jsonc, dotfiles, lockfiles).
      - name: Stage files
        run: |
          mkdir _site
          rsync -a --exclude='.*' --exclude='_site' --exclude='wrangler.jsonc' --exclude='prek.toml' --exclude='*.lock' ./ _site/
          find _site -type f | sort

      # Files the is-up.to site links to.
      - name: Check linked files
        run: |
          for path in icon/favicon.ico icon/icon.svg icon/apple-touch-icon.png icon/icon-192x192.png \
            icon/icon-512x512.png icon/icon-1024x1024.png banner/og.png; do
            test -s "_site/$path" || { echo "::error::Missing $path"; exit 1; }
          done

      # Deploy publishes this artifact; on pull requests it's a preview of the generated files.
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          if-no-files-found: error
